[tox]
envlist = py310,
          py314,
          docs
minversion = 4.0
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = run the unit tests with pytest under {basepython}
setenv = COVERAGE_FILE={env:COVERAGE_FILE:{toxinidir}/.coverage.{envname}}
passenv =
    CI
commands = pytest {posargs: --cov-config="{toxinidir}/tox.ini" --cov pyminimp3} {toxinidir}
deps = -r requirements-dev.txt

[testenv:lint]
description = Check formatting with black and isort
skip_install = True
deps =
    black
    isort
commands =
    black --check src tests
    isort --check-only lib/minimp3.pyx src tests

[testenv:pyrefly]
description = Check types with pyrefly
skip_install = True
deps = pyrefly
commands = pyrefly check

[coverage:run]
source = src/pyminimp3
parallel = True
relative_files = True

[coverage:paths]
source =
    src/pyminimp3
    .tox/*/lib/python*/site-packages/pyminimp3
    .tox/*/Lib/site-packages/pyminimp3

[coverage:report]
skip_covered = True
show_missing = True

[testenv:build]
description = Build and check the source and wheel distributions
basepython = python3.10
skip_install = True
deps =
    build
    twine
commands =
    python -m build --sdist --wheel --outdir {envtmpdir}/dist {toxinidir}
    twine check {envtmpdir}/dist/*
