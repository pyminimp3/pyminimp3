[tox]
envlist = py310,
          py314,
          docs
minversion = 4.0
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = run the unit tests with pytest under {basepython}
setenv = COVERAGE_FILE={toxworkdir}/.coverage.{envname}
passenv =
    TOXENV
    CI
    TRAVIS
    TRAVIS_*
    APPVEYOR
    APPVEYOR_*
    CODECOV_*
commands = pytest {posargs: --cov-config="{toxinidir}/tox.ini" --cov pyminimp3} {toxinidir}
deps = -r requirements-dev.txt

[testenv:black]
description = Check formatting with black
skip_install = True
deps = black
commands = black --check src tests

[testenv:isort]
description = Check import sorting with isort
skip_install = True
deps = isort
commands = isort --check-only lib/minimp3.pyx src tests

[testenv:pyrefly]
description = Check types with pyrefly
skip_install = True
deps = pyrefly
commands = pyrefly check

[testenv:coverage]
description = combine coverage data and create reports
deps = coverage
skip_install = True
changedir = {toxworkdir}
setenv = COVERAGE_FILE=.coverage
commands = coverage erase
           coverage combine
           coverage report --rcfile={toxinidir}/tox.ini
           coverage xml

[testenv:codecov]
description = [only run on CI]: upload coverage data to codecov (depends on coverage running first)
deps = codecov
skip_install = True
commands = codecov --file {toxworkdir}/coverage.xml

[coverage:run]
source = src/pyminimp3

[coverage:report]
skip_covered = True
show_missing = True

[testenv:build]
description = Build and check the source and wheel distributions
basepython = python3.10
skip_install = True
deps =
    build
    twine
commands =
    python -m build --sdist --wheel --outdir {envtmpdir}/dist {toxinidir}
    twine check {envtmpdir}/dist/*
